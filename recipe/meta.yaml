{% set name = "conpty" %}
{% set version = "1.26.3133.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/microsoft/terminal/archive/refs/tags/v{{ version }}.tar.gz
    sha256: dfdb888546e24c02d67d0312ad4c9139c08a92d27fc9830e6eda2d0cc697aca5
    # MSBuild will attempt to use NuGet to pull in WIL dependency, avoid it by manually downloading the artifact.
    # https://github.com/microsoft/terminal/blob/c4e28e32c0c868474340eb4ae415096aab9026d7/src/common.nugetversions.targets#L65
  - url: https://www.nuget.org/api/v2/package/Microsoft.Windows.ImplementationLibrary/1.0.250325.1
    fn: wil.zip
    sha256: b3e3ac9077c4f5f96bd8f90785bcae47bac6ba9688d896cd04422c8972ec5b2b
    folder: packages/Microsoft.Windows.ImplementationLibrary.1.0.250325.1
  - url: https://github.com/microsoft/GSL/archive/refs/tags/v4.2.2.tar.gz
    sha256: 59e2a0a0ea22e8bcf9db2dc4d4bd21212ac6595748295fc27a7e02cf75eac4b5
    folder: packages/gsl

build:
  number: 0
  script:
    - del vcpkg.json
    - set VcpkgEnabled=false
    - set "CL=/I%SRC_DIR%\packages\gsl\include /D FMT_HEADER_ONLY /I%LIBRARY_INC% %CL%"
    #- set "_LINK_=/LIBPATH:%LIBRARY_LIB%" fmt.lib %_LINK_%""
    #- set "LINK=/LIBPATH:%LIBRARY_LIB%" fmt.lib %LINK%""
    # Build ConPTY
    - msbuild src\winconpty\dll\winconptydll.vcxproj /p:SolutionDir=%SRC_DIR%\ /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0  /p:PlatformToolset=v143 # [win and x86_64]
    - msbuild src\winconpty\dll\winconptydll.vcxproj /p:SolutionDir=%SRC_DIR%\ /p:Configuration=Release /p:Platform=ARM64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 # [win and arm64]
    - if errorlevel 1 exit /b 1
    # Build OpenConsole.exe
    - msbuild src\host\exe\Host.EXE.vcxproj /p:SolutionDir=%SRC_DIR%\ /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 # [win and x86_64]
    - msbuild src\host\exe\Host.EXE.vcxproj /p:SolutionDir=%SRC_DIR%\ /p:Configuration=Release /p:Platform=ARM64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 # [win and arm64]
    - if errorlevel 1 exit /b 1
    # Install artifacts
    - copy %SRC_DIR%\bin\x64\Release\conpty.lib %LIBRARY_LIB%\  # [win and x86_64]
    - copy %SRC_DIR%\bin\ARM64\Release\conpty.lib %LIBRARY_LIB%\  # [win and arm64]
    - if errorlevel 1 exit /b 1
    - copy %SRC_DIR%\bin\x64\Release\conpty.dll %LIBRARY_BIN%\  # [win and x86_64]
    - copy %SRC_DIR%\bin\ARM64\Release\conpty.dll %LIBRARY_BIN%\  # [win and arm64]
    - if errorlevel 1 exit /b 1
    # Copy the optional OpenConsole.exe binary. While the DLL can use conhost.exe fallback (present on modern
    # Windows versions), some depending packages explicitly search for 'OpenConsole.exe' in their build process.
    - copy %SRC_DIR%\bin\x64\Release\OpenConsole.exe %LIBRARY_BIN%\  # [win and x86_64]
    - copy %SRC_DIR%\bin\ARM64\Release\OpenConsole.exe %LIBRARY_BIN%\  # [win and arm64]
    - if errorlevel 1 exit /b 1
    # Headers are part of the Windows SDK (consoleapi.h)
  skip: true  # [not win]
  missing_dso_whitelist:
    - "*/api-ms-win-*.dll"
    - "*/ext-ms-win-uiacore-*.dll"

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - fmt >=12.1.0
  run:

test:
  files:
    - test_conpty.py
  requires:
    - python
  commands:
    - if not exist %LIBRARY_BIN%\conpty.dll exit 1
    - if not exist %LIBRARY_LIB%\conpty.lib exit 1
    - python test_conpty.py

about:
  home: https://github.com/microsoft/terminal/tree/main/src/winconpty
  summary: Windows Pseudo Console (ConPTY)
  description: Windows Pseudo Console (ConPTY) library. Headers are provided by the Windows SDK (include 'consoleapi.h' to use).
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/microsoft/terminal/tree/main/src/winconpty
  doc_url: https://learn.microsoft.com/en-us/windows/console/creating-a-pseudoconsole-session

extra:
  recipe-maintainers:
    - TS-ANC
